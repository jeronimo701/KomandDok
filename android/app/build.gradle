plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}
android {
    namespace 'ru.j701.trips'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.j701.trips'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.4'
        testInstrumentationRunner 'ru.j701.trips.SmokeRunner'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
chaquopy {
    defaultConfig {
        version = '3.13'
        pip {
            install 'Flask==3.1.0'
            install 'reportlab==4.2.5'
            install 'pypdf==6.10.2'
            install 'Pillow==11.0.0'
        }
        extractPackages 'fonts'
    }
}
dependencies { implementation 'androidx.core:core:1.15.0' }
