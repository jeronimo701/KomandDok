<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Предпросмотр документа</title><style>
*{box-sizing:border-box}body{margin:0;background:#40434a}.page{display:block;width:min(100%,794px);margin:15px auto;background:white;box-shadow:0 2px 14px #0005}.page img{display:block;width:100%;height:auto}@page{size:A4;margin:0}@media print{html,body{background:white;margin:0}.page{width:210mm;margin:0;box-shadow:none;break-after:page;page-break-after:always}.page:last-child{break-after:auto;page-break-after:auto}.page img{width:210mm;max-height:297mm;object-fit:contain}}
</style></head><body>{% for page in range(pages) %}<div class="page"><img src="{{ url_for('preview_page',key=key,path=path,page=page) }}" alt="Страница {{ page+1 }}" loading="eager"></div>{% endfor %}</body></html>
